ServerName food.dhemeira.hu

Alias /api /srv/backend/api

<Directory /srv/backend/api>
    Require all granted
    RewriteEngine On
    # Route API paths that aren't real files (auth, recipes, admin, ...) through the router.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /srv/backend/index.php [L,QSA]
</Directory>

<Directory /srv/backend>
    Require all granted
</Directory>

<Directory /var/www/html>
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^ /index.html [L]
</Directory>

<Files "sw.js">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
</Files>