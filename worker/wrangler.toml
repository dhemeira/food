name = "recipe-images"
main = "src/index.ts"
compatibility_date = "2026-09-07"

# Bind to an R2 bucket (create "recipe-images" in the Cloudflare dashboard first).
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "recipe-images"

[vars]
# Firebase project id — used to verify the ID token (issuer + audience).
FIREBASE_PROJECT_ID = "your-firebase-project-id"
# Public base URL that serves the R2 bucket (e.g. a custom domain bound to R2).
IMG_BASE_URL = "https://img.dhemeira.hu"
