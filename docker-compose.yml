name: food

services:
  # The app and development container: Vite plus Claude Code, git and the CLI
  # tools. Attach VS Code to this container for in-container IntelliSense and
  # run `claude` from its integrated terminal.
  app:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
    init: true
    command: npm run dev -- --host 0.0.0.0
    working_dir: /app
    ports:
      - '5050:5050'
    volumes:
      - .:/app
      # The only node_modules: Linux dependencies used by Vite, VS Code's
      # language servers and the terminal. The host does not need one.
      - app_node_modules:/app/node_modules
      # Persists Claude Code history/settings, git config, gh auth, VS Code
      # Server, shell history and the npm cache across container rebuilds.
      - app_home:/home/node
    environment:
      # File watching over Docker Desktop bind mounts is unreliable without this.
      - CHOKIDAR_USEPOLLING=true
      - TERM=xterm-256color
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      # Claude Code gateway settings. Values live in the gitignored .env file;
      # empty defaults keep compose working without it.
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_DEFAULT_OPUS_MODEL=${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      - ANTHROPIC_DEFAULT_SONNET_MODEL=${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      - ANTHROPIC_DEFAULT_HAIKU_MODEL=${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      - CLAUDE_CODE_SUBAGENT_MODEL=${CLAUDE_CODE_SUBAGENT_MODEL:-}
      - CLAUDE_CODE_EFFORT_LEVEL=${CLAUDE_CODE_EFFORT_LEVEL:-}
      - CLAUDE_CODE_AUTO_COMPACT_WINDOW=${CLAUDE_CODE_AUTO_COMPACT_WINDOW:-}
      # Optional git identity (set in .env) for commits made in the container.
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5050').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 24
      # The entrypoint may run `npm ci` on the first start after a lock change.
      start_period: 300s

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    command: 'tunnel --no-autoupdate --config /etc/cloudflared/config.yml run --token ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in .env}'
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_node_modules:
  app_home:
